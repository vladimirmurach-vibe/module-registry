module:
  id: mod-chart-echarts
  name: Apache ECharts
  type: source_code
  maturity: production
  owner: Apache Software Foundation

  description:
    summary: Мощная библиотека для визуализации с поддержкой сотен типов графиков, включая столбчатые, линейные, тепловые карты, древовидные.
    business_context:
      domains: ["planning", "forecast", "analytics"]
      use_cases:
        - "Визуализация консенсус-прогноза в разрезе измерений"
        - "Отображение распределения корректировок по SKU/магазинам"

  capabilities:
    - "Динамическое обновление данных (setOption)"
    - "Поддержка иерархических данных (treemap, sunburst)"
    - "События клика, наведения"
    - "Адаптивная вёрстка"
    - "Экспорт в PNG/SVG"
    - "Поддержка тёмной темы"

  interfaces:
    inputs:
      - "Набор данных (агрегированный по осям)"
      - "Конфигурация графика (тип, оси, легенда)"
    outputs:
      - "Отображённый график в контейнере"
      - "События взаимодействия пользователя"

  contracts:
    consumes:
      - "Агрегированные данные (например, { category: ..., value: ... })"
      - "Опционально – иерархическая структура для treemap"
    produces:
      - "Визуализация, готовая для встраивания"

  constraints:
    requires: "Vanilla JS (есть обёртки для React/Vue)"
    license: "Apache-2.0"
    performance: "Способен отображать тысячи точек без проблем"

  generation:
    templates:
      - "Компонент для инициализации ECharts"
    instructions:
      - "Создать график с использованием ECharts, передав данные и конфигурацию."
      - "Обрабатывать событие клика для drill-down, если требуется."

  matching:
    keywords: ["echarts", "chart", "visualization", "treemap", "line", "bar"]
    preferred_when:
      - "Требуется широкий спектр типов графиков"
      - "Необходима поддержка иерархических визуализаций"
    avoid_when:
      - "Нужна максимальная лёгкость (весит ~800KB)"
      - "Проект требует минимальной зависимости"
