module:
  id: mod-pivot-tabulator
  name: Tabulator with Pivot Module
  type: source_code
  maturity: production
  owner: Tabulator

  description:
    summary: Легковесная таблица с модульной структурой, включая pivot-модуль для группировки и агрегации.
    business_context:
      domains: ["planning", "forecast", "analytics"]
      use_cases:
        - "Построение сводной таблицы с агрегацией"
        - "Редактирование корректировок"

  capabilities:
    - "Группировка по нескольким полям (строки и столбцы)"
    - "Агрегация (сумма, среднее и др.)"
    - "Редактирование ячеек с валидацией"
    - "Поддержка вложенных иерархий (expand/collapse)"
    - "Экспорт в CSV/Excel (через дополнительный модуль)"
    - "Работа с большими данными (~100k записей) с виртуализацией"

  interfaces:
    inputs:
      - "Массив данных"
      - "Конфигурация колонок, группировок и агрегаций"
    outputs:
      - "Сгенерированная таблица"
      - "Обновлённые данные (изменения ячеек)"
      - "Экспортируемый файл"

  contracts:
    consumes:
      - "Набор данных с измерениями и мерами"
    produces:
      - "Агрегированные данные на текущем уровне"
      - "Детальные значения после редактирования"

  constraints:
    requires: "Vanilla JS (есть обёртки для React/Vue, но базовый модуль – чистый JS)"
    license: "MIT (бесплатно)"
    performance: "Хорошая производительность, поддерживает виртуализацию"

  generation:
    templates:
      - "Инициализация Tabulator с нужными опциями"
    instructions:
      - "Создать таблицу с использованием Tabulator, настроить группировку и агрегацию."
      - "Подписаться на события редактирования и передавать изменения наружу."

  matching:
    keywords: ["tabulator", "pivot", "grouping", "editing", "vanilla js"]
    preferred_when:
      - "Нужна лёгкая и бесплатная библиотека"
      - "Проект использует Vanilla JS"
      - "Требуется поддержка большого объёма данных"
    avoid_when:
      - "Нужен готовый drag&drop интерфейс для настройки (придётся дописывать)"
      - "Требуется глубокая кастомизация стилей"
