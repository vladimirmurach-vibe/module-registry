module:
  id: mod-pivot-ag-grid-react
  name: Ag-Grid Pivot Table (React)
  type: source_code
  maturity: production
  owner: Ag-Grid Ltd

  description:
    summary: Мощная таблица с полноценным pivot-режимом, группировкой, агрегацией, редактированием ячеек и поддержкой иерархий.
    business_context:
      domains: ["planning", "forecast", "analytics"]
      use_cases:
        - "Интерактивная работа с прогнозом через сводную таблицу"
        - "Ввод корректировок на любом уровне агрегации"
        - "Автоматическая дезагрегация и пересчёт консенсус-прогноза"

  capabilities:
    - "Динамическая настройка строк, столбцов и фильтров через drag-and-drop"
    - "Агрегация данных по сумме (и другим функциям)"
    - "Inline-редактирование с валидацией чисел"
    - "Поддержка иерархических измерений с раскрытием (drill-down)"
    - "Кастомизация отображения (фон, шрифты, границы)"
    - "Экспорт в Excel/CSV"
    - "Индикация изменённых ячеек (синяя точка)"
    - "Сохранение пользовательских представлений (виджетов)"

  interfaces:
    inputs:
      - "Набор данных (массив объектов) с полями для измерений и мер"
      - "Конфигурация сводной таблицы (строки, столбцы, фильтры, меры)"
      - "События пользователя (клик, ввод, навигация)"
    outputs:
      - "Отрисованная таблица с данными"
      - "Обновлённые данные после редактирования (включая дезагрегированные значения)"
      - "Экспортируемый файл (Excel/CSV)"
      - "События изменения ячеек для пересчёта"

  contracts:
    consumes:
      - "Модель данных с измеренями: Товар (SKU, Категория), Локация (Магазин, Регион), Период (Неделя, Месяц)"
      - "Значения мер: Базовый прогноз, Корректировка, Консенсус-прогноз"
    produces:
      - "Агрегированные данные на запрошенных уровнях"
      - "Изменённые детальные записи корректировок после дезагрегации"

  constraints:
    requires: "React 17+ (или Vanilla JS при другой настройке)"
    license: "Community free, Enterprise requires license"
    performance: "Хорошо работает до 100k записей при включённой виртуализации"

  generation:
    templates:
      - "React-компонент с использованием Ag-Grid React"
      - "Обёртка для интеграции с бизнес-логикой (дезагрегация, пересчёт)"
    instructions:
      - "Сгенерировать компонент сводной таблицы, принимающий набор данных и конфигурацию."
      - "Внедрить обработку редактирования ячеек и вызов внешних колбэков для обновления данных."
      - "Добавить кнопки экспорта и сохранения представлений."

  matching:
    keywords: ["pivot", "table", "ag-grid", "react", "editing", "aggregation", "hierarchy"]
    preferred_when:
      - "Проект требует сложного редактирования и иерархий"
      - "Команда знакома с React"
      - "Допускается использование коммерческих компонентов"
    avoid_when:
      - "Проект на Vue или Angular (требуется другая интеграция)"
      - "Бюджет не позволяет приобрести лицензию Enterprise"
      - "Необходим лёгкий вес и простая таблица без излишеств"
