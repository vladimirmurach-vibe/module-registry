module:
  id: mod-pivot-handsontable
  name: Handsontable with Pivot Plugin
  type: source_code
  maturity: beta
  owner: Handsoncode

  description:
    summary: Таблица, похожая на Excel, с поддержкой редактирования, формул и плагином для pivot-агрегации.
    business_context:
      domains: ["planning", "forecast", "analytics"]
      use_cases:
        - "Ввод корректировок в табличном редакторе"
        - "Базовая агрегация для просмотра прогноза"

  capabilities:
    - "Редактирование ячеек с поддержкой клавиатурной навигации (Enter, Tab)"
    - "Базовая агрегация и группировка через pivot-плагин"
    - "Встроенная валидация числового ввода"
    - "Экспорт в Excel и CSV"
    - "Визуальная индикация изменённых ячеек"

  interfaces:
    inputs:
      - "Плоский набор данных с колонками измерений и мер"
      - "Конфигурация группировки и агрегации"
    outputs:
      - "Таблица с возможностью редактирования"
      - "Обновлённые данные после сохранения"

  contracts:
    consumes:
      - "Данные с колонками для измерений и значений мер"
    produces:
      - "Отредактированные данные корректировок (на уровне строк)"

  constraints:
    requires: "Vanilla JS или React/Vue (официальные обёртки)"
    license: "Community free, Pro платный"
    performance: "Ограниченная производительность при >50k записей"

  generation:
    templates:
      - "Компонент таблицы с настройкой колонок"
    instructions:
      - "Интегрировать Handsontable и настроить колонки для редактирования только поля 'Корректировка'."
      - "Подключить плагин pivot для агрегации по выбранным измерениям."

  matching:
    keywords: ["handsontable", "excel-like", "editing", "pivot", "spreadsheet"]
    preferred_when:
      - "Пользователи привыкли к Excel-подобному интерфейсу"
      - "Нужна простая агрегация без сложных иерархий"
    avoid_when:
      - "Требуются вложенные иерархии (регион->магазин и т.п.)"
      - "Необходима серьёзная кастомизация внешнего вида"
